[project]
name = "agentloom-api"
version = "0.1.0"
description = "AgentLoom durable workflow API and worker"
requires-python = ">=3.11,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4",
 "pgvector>=0.3.6,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
 "openai>=2,<3", "python-multipart>=0.0.20", "pypdf>=5,<7", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
